# Render Blueprint: legt das Backend als kostenlosen Docker-Service an.
# Auf render.com: "New" → "Blueprint" → dieses Repo auswählen.
services:
  - type: web
    name: arynta-spielesammlung
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Erst deployen, wenn die Tests auf GitHub grün sind (.github/workflows/tests.yml)
    autoDeployTrigger: checksPass
    envVars:
      # Nach dem ersten Deploy des Frontends hier dessen Adresse eintragen,
      # z. B. https://werwolf.pages.dev (mehrere kommagetrennt)
      - key: ALLOWED_ORIGINS
        sync: false
      # Render steht als Proxy davor. Ohne diese Zeile hätten alle Spieler dieselbe Adresse
      # und teilten sich das Raumlimit pro Adresse (app.limits.rooms-per-address).
      - key: CLIENT_IP_HEADER
        value: X-Forwarded-For
      # Geo-Bingo: Google-Street-View-Viewer pro Tag, danach Mapillary. Leer oder 0 = nur Mapillary.
      # Erst auf 150 setzen, wenn GOOGLE_MAPS_KEY und das Google-Kontingent eingerichtet sind
      # (README, Schritt 6).
      - key: STREET_VIEW_DAILY_LIMIT
        sync: false
