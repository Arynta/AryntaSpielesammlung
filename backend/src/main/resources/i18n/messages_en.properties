game.WERWOLF.name=Werewolf
game.WERWOLF.description=Roles are dealt in secret. At night the werewolves hunt, by day the village tries to find them.
game.IMPOSTOR.name=Impostor
game.IMPOSTOR.description=Everyone knows the same secret word except one. Find them before they bluff their way through.
game.TABU.name=Taboo
game.TABU.description=Explain words to your team without saying the forbidden ones. A watcher has the buzzer.
game.NOBODY_IS_PERFECT.name=Nobody is Perfect
game.NOBODY_IS_PERFECT.description=Everyone makes up a believable answer to odd questions. Who finds the real one, who fools the others?
game.BUZZER.name=Buzzer
game.BUZZER.description=Not a game but a quiz tool: whoever presses first goes first. The game master sees the order.
game.GEO_BINGO.name=Geo Bingo
game.GEO_BINGO.description=You walk through street images of the same city and look for the items on your bingo card. The others confirm every find.

