# Platzhalter wie bei String.format: %s für Text, %d für Zahlen.

game.WERWOLF.name=Werwolf
game.WERWOLF.description=Rollen werden geheim verteilt. Nachts jagen die Werwölfe, tagsüber sucht das Dorf sie.
game.IMPOSTOR.name=Impostor
game.IMPOSTOR.description=Alle kennen dasselbe geheime Wort, nur einer nicht. Findet ihn, bevor er sich durchmogelt.
game.TABU.name=Tabu
game.TABU.description=Erklärt eurem Team Begriffe, ohne die verbotenen Wörter zu sagen. Ein Aufpasser hat den Buzzer.
game.NOBODY_IS_PERFECT.name=Nobody is Perfect
game.NOBODY_IS_PERFECT.description=Zu kuriosen Fragen erfindet jeder eine glaubwürdige Antwort. Wer findet die echte, wer legt die anderen rein?
game.BUZZER.name=Buzzer
game.BUZZER.description=Kein Spiel, sondern ein Werkzeug fürs Quiz: Wer zuerst drückt, ist dran. Die Spielleitung sieht die Reihenfolge.
game.GEO_BINGO.name=Geo-Bingo
game.GEO_BINGO.description=Ihr lauft durch Straßenbilder derselben Stadt und sucht die Motive eurer Bingo-Karte. Die anderen bestätigen jeden Fund.

