spring.application.name=werwolf

# Render gibt den Port über die Umgebungsvariable PORT vor
server.port=${PORT:8080}

# Kommagetrennt, z. B. https://werwolf.pages.dev,http://localhost:5173
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Spiele, die in der Lobby mit "Bald verfügbar" gesperrt sind, kommagetrennt (z. B. GEO_BINGO).
# Zum Freischalten LOCKED_GAMES leer setzen.
app.locked-games=${LOCKED_GAMES:GEO_BINGO}

# Schutz gegen Skripte, Begründung in docs/entscheidungen.md
app.limits.messages-per-second=${MAX_MESSAGES_PER_SECOND:20}
app.limits.unknown-codes=10
app.limits.rooms-per-address=10
app.limits.max-message-bytes=8192
# Die App schickt alle 25 Sekunden ein ping, still ist nur eine tote Verbindung
app.limits.idle-timeout=2m
# Kopfzeile mit der echten Adresse hinter einem Proxy, leer = Adresse der Verbindung. Auf Render: X-Forwarded-For
app.client-ip-header=${CLIENT_IP_HEADER:}
