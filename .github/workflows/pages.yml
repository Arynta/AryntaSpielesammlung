# Baut die Flutter-Seite und stellt sie auf GitHub Pages.
# Die Backend-Adresse kommt aus der Repo-Variable VITE_BACKEND_URL,
# der Schlüssel für die Geo-Bingo-Straßenbilder aus MAPILLARY_TOKEN.
name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", "backend/src/main/resources/games/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
      - id: pages
        uses: actions/configure-pages@v5
      - run: flutter pub get
      - run: dart run tool/sync_assets.dart
      - run: flutter test
      - run: >
          flutter build web --release --no-web-resources-cdn
          --base-href "${{ steps.pages.outputs.base_path }}/"
          --dart-define=BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
          --dart-define=MAPILLARY_TOKEN=${{ vars.MAPILLARY_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4